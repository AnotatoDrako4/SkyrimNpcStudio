name: windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.11.2-msvc2022_64-${{ hashFiles('scripts/fetch_qt.py') }}

      - name: Install Qt 6.11.2 (verified archives)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --quiet py7zr==1.1.3
          python -I scripts/fetch_qt.py "${{ runner.temp }}/Qt" --version 6.11.2

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        env:
          SNS_QT_DIR: ${{ runner.temp }}/Qt/6.11.2/msvc2022_64
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: .NET tests
        run: dotnet test --solution SkyrimNpcStudio.slnx

      - name: C++ tests (local MO2 tests skip themselves)
        run: ctest --preset debug -j 4

      - name: UI smoke test (offscreen, no MO2)
        shell: pwsh
        env:
          SNS_QT_DIR: ${{ runner.temp }}/Qt/6.11.2/msvc2022_64
          SNS_DOTNET_ROOT: ${{ env.DOTNET_ROOT }}
        run: |
          $env:PATH = "$env:SNS_QT_DIR\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QPA_FONTDIR = "$env:WINDIR\Fonts"
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $p = Start-Process build/debug/bin/SkyrimNpcStudio.exe -ArgumentList '--smoke-test','--screenshot','smoke.png' -NoNewWindow -PassThru -RedirectStandardError smoke.log -Wait
          Get-Content smoke.log
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (Select-String -Path smoke.log -Pattern '\.qml:\d+' | Where-Object { $_.Line -notmatch 'propertyCache' }) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            smoke.png
            smoke.log
